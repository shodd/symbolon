[package]
name = "symbolon-crypto"
description = "Symbolon's cryptographic constructions (PROTOCOL.md §1-§4.1, §8.1, §9)"
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
symbolon-protocol.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
hkdf = { version = "0.13", default-features = false }
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "chacha", "hkdfsha2", "mlkem", "x25519"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
rand_core = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
unicode-normalization = { version = "0.1.26", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

# Browser extension and Cloudflare Workers are both JavaScript hosts, so the OS
# CSPRNG there is `crypto.getRandomValues` (see README.md, "WebAssembly").
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
hex = "0.4"
rand_chacha = "0.10"
serde_json = "1"

[lints]
workspace = true
